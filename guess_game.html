<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<title>Познай числото</title>
<style>
  body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
  #result { margin-top: 20px; font-weight: bold; }
</style>
</head>
<body>
<h1>Игра: Познай числото</h1>
<p>Познайте число между 1 и 100</p>
<input type="number" id="guess" min="1" max="100" />
<button onclick="checkGuess()">Пробвай</button>
<div id="result"></div>
<button id="restart" onclick="startGame()" style="display:none;">Нова игра</button>

<script>
let secret, attempts;

function startGame() {
  secret = Math.floor(Math.random() * 100) + 1;
  attempts = 0;
  document.getElementById('result').textContent = '';
  document.getElementById('restart').style.display = 'none';
  document.getElementById('guess').value = '';
  document.getElementById('guess').disabled = false;
}

function checkGuess() {
  const input = document.getElementById('guess');
  const guess = parseInt(input.value, 10);
  if (isNaN(guess)) {
    document.getElementById('result').textContent = 'Моля, въведете валидно число.';
    return;
  }
  attempts++;
  if (guess < secret) {
    document.getElementById('result').textContent = 'По-голямо!';
  } else if (guess > secret) {
    document.getElementById('result').textContent = 'По-малко!';
  } else {
    document.getElementById('result').textContent = `Познахте! Числото беше ${secret}. Опитахте ${attempts} пъти.`;
    document.getElementById('restart').style.display = 'inline';
    input.disabled = true;
  }
}

window.onload = startGame;
</script>
</body>
</html>
